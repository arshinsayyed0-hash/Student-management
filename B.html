<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            margin-top: 15px;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
        }

        .search-box select {
            width: 200px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #2563eb;
            color: white;
            padding: 14px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
            margin-right: 5px;
        }

        .delete-btn {
            background: #dc2626;
            color: white;
        }

        .edit-btn:hover {
            background: #d97706;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .empty {
            text-align: center;
            padding: 20px;
            color: #777;
        }

        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management Dashboard</h1>

    <!-- Student Form -->
    <div class="form-box">

        <div class="form-row">

            <input type="text" id="name" placeholder="Enter Student Name">

            <input type="text" id="roll" placeholder="Enter Roll Number">

            <input type="email" id="email" placeholder="Enter Email">

            <select id="course">
                <option value="">Select Course</option>
                <option value="BCA">BCA</option>
                <option value="BBA">BBA</option>
                <option value="BSc">BSc</option>
                <option value="BCS">BCS</option>
                <option value="MCA">MCA</option>
            </select>

        </div>

        <button class="add-btn" onclick="saveStudent()" id="saveBtn">
            Add Student
        </button>

    </div>

    <!-- Search and Filter -->
    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="Search student..."
            onkeyup="displayStudents()"
        >

        <select id="filterCourse" onchange="displayStudents()">

            <option value="">All Courses</option>
            <option value="BCA">BCA</option>
            <option value="BBA">BBA</option>
            <option value="BSc">BSc</option>
            <option value="BCS">BCS</option>
            <option value="MCA">MCA</option>

        </select>

    </div>

    <!-- Student Table -->
    <div class="table-container">

        <table>

            <thead>

                <tr>
                    <th>Sr. No.</th>
                    <th>Name</th>
                    <th>Roll No.</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>

            </thead>

            <tbody id="studentTable">

            </tbody>

        </table>

    </div>

</div>


<script>

    // Get students from localStorage
    let students = JSON.parse(localStorage.getItem("students")) || [];

    let editIndex = -1;


    // Save Student
    function saveStudent() {

        let name = document.getElementById("name").value.trim();
        let roll = document.getElementById("roll").value.trim();
        let email = document.getElementById("email").value.trim();
        let course = document.getElementById("course").value;

        // Validation
        if (name === "" || roll === "" || email === "" || course === "") {

            alert("Please fill all fields.");

            return;
        }


        let student = {
            name: name,
            roll: roll,
            email: email,
            course: course
        };


        // Edit existing student
        if (editIndex !== -1) {

            students[editIndex] = student;

            editIndex = -1;

            document.getElementById("saveBtn").innerText = "Add Student";

        }

        // Add new student
        else {

            students.push(student);

        }


        // Save data
        localStorage.setItem("students", JSON.stringify(students));


        clearForm();

        displayStudents();

    }


    // Display Students
    function displayStudents() {

        let table = document.getElementById("studentTable");

        let search = document
            .getElementById("search")
            .value
            .toLowerCase();

        let filterCourse = document
            .getElementById("filterCourse")
            .value;


        table.innerHTML = "";


        let filteredStudents = students.filter(function(student) {

            let matchesSearch =
                student.name.toLowerCase().includes(search) ||
                student.roll.toLowerCase().includes(search) ||
                student.email.toLowerCase().includes(search);

            let matchesCourse =
                filterCourse === "" ||
                student.course === filterCourse;

            return matchesSearch && matchesCourse;

        });


        if (filteredStudents.length === 0) {

            table.innerHTML = `
                <tr>
                    <td colspan="6" class="empty">
                        No students found
                    </td>
                </tr>
            `;

            return;
        }


        filteredStudents.forEach(function(student) {

            let originalIndex = students.indexOf(student);

            let row = `
                <tr>

                    <td>${originalIndex + 1}</td>

                    <td>${student.name}</td>

                    <td>${student.roll}</td>

                    <td>${student.email}</td>

                    <td>${student.course}</td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick="editStudent(${originalIndex})">
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteStudent(${originalIndex})">
                            Delete
                        </button>

                    </td>

                </tr>
            `;

            table.innerHTML += row;

        });

    }


    // Edit Student
    function editStudent(index) {

        let student = students[index];

        document.getElementById("name").value = student.name;

        document.getElementById("roll").value = student.roll;

        document.getElementById("email").value = student.email;

        document.getElementById("course").value = student.course;


        editIndex = index;

        document.getElementById("saveBtn").innerText = "Update Student";

    }


    // Delete Student
    function deleteStudent(index) {

        let confirmDelete =
            confirm("Are you sure you want to delete this student?");

        if (confirmDelete) {

            students.splice(index, 1);

            localStorage.setItem(
                "students",
                JSON.stringify(students)
            );

            displayStudents();

        }

    }


    // Clear Form
    function clearForm() {

        document.getElementById("name").value = "";

        document.getElementById("roll").value = "";

        document.getElementById("email").value = "";

        document.getElementById("course").value = "";

    }


    // Display data when page loads
    displayStudents();

</script>

</body>
</html>
