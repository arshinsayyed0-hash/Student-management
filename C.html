<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini Amazon</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f3f3;
        }

        /* Navbar */
        .navbar {
            background: #131921;
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 25px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .search {
            flex: 1;
            display: flex;
        }

        .search input {
            width: 100%;
            padding: 12px;
            border: none;
            font-size: 16px;
        }

        .search button {
            padding: 12px 18px;
            background: #febd69;
            border: none;
            cursor: pointer;
        }

        .cart-btn {
            background: #ff9900;
            border: none;
            padding: 12px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Hero */
        .hero {
            background: linear-gradient(120deg, #232f3e, #37475a);
            color: white;
            padding: 60px 20px;
            text-align: center;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 18px;
        }

        /* Products */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            margin-bottom: 20px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }

        .product-card h3 {
            margin: 10px 0;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #b12704;
            margin: 10px 0;
        }

        .product-card button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 5px;
        }

        .details-btn {
            background: #e7e7e7;
        }

        .add-btn {
            background: #ffd814;
        }

        /* Popup */
        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            margin: 100px auto;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
        }

        .modal-content img {
            width: 200px;
            height: 200px;
            object-fit: contain;
        }

        .close {
            float: right;
            font-size: 28px;
            cursor: pointer;
        }

        /* Cart */
        .cart-section {
            display: none;
            background: white;
            padding: 25px;
            margin: 30px auto;
            max-width: 1000px;
            border-radius: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .total {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        /* Responsive */
        @media(max-width: 900px) {
            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 600px) {

            .navbar {
                flex-wrap: wrap;
                padding: 12px;
            }

            .logo {
                width: 100%;
                text-align: center;
            }

            .search {
                width: 100%;
            }

            .products {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">

    <div class="logo">
        Mini Amazon
    </div>

    <div class="search">
        <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
            onkeyup="searchProducts()"
        >

        <button>🔍</button>
    </div>

    <button class="cart-btn" onclick="showCart()">
        🛒 Cart (<span id="cartCount">0</span>)
    </button>

</nav>


<!-- HERO -->
<section class="hero">

    <h1>Welcome to Mini Amazon</h1>

    <p>Shop your favourite products at the best prices</p>

</section>


<!-- PRODUCTS -->
<div class="container">

    <h2 class="section-title">
        Featured Products
    </h2>

    <div class="products" id="productList">

    </div>

</div>


<!-- CART -->
<div class="cart-section" id="cartSection">

    <h2>🛒 Your Cart</h2>

    <div id="cartItems"></div>

    <div class="total">
        Total: ₹<span id="cartTotal">0</span>
    </div>

</div>


<!-- PRODUCT DETAILS POPUP -->
<div class="modal" id="productModal">

    <div class="modal-content">

        <span class="close" onclick="closeModal()">
            &times;
        </span>

        <img id="modalImage">

        <h2 id="modalName"></h2>

        <p id="modalDescription"></p>

        <h3 class="price">
            ₹<span id="modalPrice"></span>
        </h3>

        <button
            class="add-btn"
            onclick="addModalProduct()">
            Add to Cart
        </button>

    </div>

</div>


<script>

    // Product Data

    const products = [

        {
            id: 1,
            name: "Wireless Headphones",
            price: 1499,
            image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e",
            description: "High quality wireless headphones with clear sound."
        },

        {
            id: 2,
            name: "Smart Watch",
            price: 2499,
            image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30",
            description: "Modern smart watch with fitness tracking features."
        },

        {
            id: 3,
            name: "Laptop",
            price: 49999,
            image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853",
            description: "Powerful laptop suitable for study and work."
        },

        {
            id: 4,
            name: "Smartphone",
            price: 19999,
            image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9",
            description: "Latest smartphone with powerful performance."
        },

        {
            id: 5,
            name: "Camera",
            price: 29999,
            image: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32",
            description: "Professional camera for high quality photography."
        },

        {
            id: 6,
            name: "Sneakers",
            price: 1999,
            image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff",
            description: "Comfortable and stylish sneakers for everyday use."
        },

        {
            id: 7,
            name: "Backpack",
            price: 999,
            image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62",
            description: "Durable backpack suitable for college and travel."
        },

        {
            id: 8,
            name: "Keyboard",
            price: 799,
            image: "https://images.unsplash.com/photo-1587829741301-dc798b83add3",
            description: "Comfortable keyboard for typing and gaming."
        }

    ];


    // Get cart from localStorage

    let cart = JSON.parse(
        localStorage.getItem("cart")
    ) || [];


    let selectedProduct = null;


    // Display Products

    function displayProducts(list = products) {

        const productList =
            document.getElementById("productList");

        productList.innerHTML = "";


        list.forEach(product => {

            productList.innerHTML += `

                <div class="product-card">

                    <img
                        src="${product.image}"
                        alt="${product.name}"
                    >

                    <h3>
                        ${product.name}
                    </h3>

                    <p class="price">
                        ₹${product.price}
                    </p>

                    <button
                        class="details-btn"
                        onclick="showDetails(${product.id})">
                        View Details
                    </button>

                    <button
                        class="add-btn"
                        onclick="addToCart(${product.id})">
                        Add to Cart
                    </button>

                </div>

            `;

        });

    }


    // Search Products

    function searchProducts() {

        const search =
            document
            .getElementById("searchInput")
            .value
            .toLowerCase();


        const filtered =
            products.filter(product =>
                product.name
                .toLowerCase()
                .includes(search)
            );


        displayProducts(filtered);

    }


    // Product Details

    function showDetails(id) {

        selectedProduct =
            products.find(product =>
                product.id === id
            );


        document.getElementById("modalImage")
            .src = selectedProduct.image;

        document.getElementById("modalName")
            .innerText = selectedProduct.name;

        document.getElementById("modalDescription")
            .innerText = selectedProduct.description;

        document.getElementById("modalPrice")
            .innerText = selectedProduct.price;


        document.getElementById("productModal")
            .style.display = "block";

    }


    // Close Modal

    function closeModal() {

        document.getElementById("productModal")
            .style.display = "none";

    }


    // Add Modal Product

    function addModalProduct() {

        if (selectedProduct) {

            addToCart(selectedProduct.id);

            closeModal();

        }

    }


    // Add To Cart

    function addToCart(id) {

        const product =
            products.find(product =>
                product.id === id
            );


        cart.push(product);


        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );


        updateCartCount();

        alert(
            product.name +
            " added to cart!"
        );

    }


    // Update Cart Count

    function updateCartCount() {

        document.getElementById("cartCount")
            .innerText = cart.length;

    }


    // Show Cart

    function showCart() {

        const cartSection =
            document.getElementById("cartSection");


        cartSection.style.display = "block";


        displayCart();


        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });

    }


    // Display Cart

    function displayCart() {

        const cartItems =
            document.getElementById("cartItems");


        cartItems.innerHTML = "";


        if (cart.length === 0) {

            cartItems.innerHTML =
                "<p>Your cart is empty.</p>";

            document.getElementById("cartTotal")
                .innerText = "0";

            return;

        }


        let total = 0;


        cart.forEach((product, index) => {

            total += product.price;


            cartItems.innerHTML += `

                <div class="cart-item">

                    <div>

                        <strong>
                            ${product.name}
                        </strong>

                        <br>

                        ₹${product.price}

                    </div>

                    <button
                        class="remove-btn"
                        onclick="removeFromCart(${index})">
                        Remove
                    </button>

                </div>

            `;

        });


        document.getElementById("cartTotal")
            .innerText = total;

    }


    // Remove From Cart

    function removeFromCart(index) {

        cart.splice(index, 1);


        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );


        updateCartCount();

        displayCart();

    }


    // Initial Display

    displayProducts();

    updateCartCount();

</script>

</body>
</html>
